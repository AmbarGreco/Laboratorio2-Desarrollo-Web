    <title>Ejemplo de Tabla</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        table {
            width: 700px;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
        }

        th {
            background-color: #dfe6e9;
            color: #2d3436;
            padding: 10px;
            border: 1px solid #b2bec3;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #b2bec3;
        }

        #buenos-aires,
        #cordoba {
            background-color: #74b9ff;
            color: white;
            text-align: left;
        }

        tr:hover {
            background-color: #f1f2f6;
        }

        tr th[headers="buenos-aires"],
        tr th[headers="cordoba"] {
            text-align: left;
        }
    </style>

</head>

<body>

    <table>

        <caption>Informe de gastos de viaje</caption>

        <tr>
            <th></th>
            <th>Comida</th>
            <th>Hotel</th>
            <th>Transporte</th>
            <th>Subtotal</th>
        </tr>

        <tr>
            <th id="buenos-aires" axis="buenos-aires">Buenos Aires</th>
        </tr>

        <tr>
            <th headers="buenos-aires">25-Ago-97</th>
            <td>37.34</td>
            <td>112.00</td>
            <td>45.00</td>
            <td></td>
        </tr>

        <tr>
            <th headers="buenos-aires">26-Ago-97</th>
            <td>27.28</td>
            <td>112.00</td>
            <td>45.00</td>
            <td></td>
        </tr>

        <tr>
            <th headers="buenos-aires">Subtotales</th>
            <td>65.00</td>
            <td>224.00</td>
            <td>90.00</td>
            <td>379.02</td>
        </tr>

        <tr>
            <th id="cordoba" axis="cordoba">Córdoba</th>
        </tr>

        <tr>
            <th headers="cordoba">27-ago97</th>
            <td>96.00</td>
            <td>109.00</td>
            <td>36.00</td>
            <td></td>
        </tr>

        <tr>
            <th headers="cordoba">28-ago97</th>
            <td>35.00</td>
            <td>109.00</td>
            <td>36.00</td>
            <td></td>
        </tr>

        <tr>
            <th headers="cordoba">Subtotales</th>
            <td>196.27</td>
            <td>442.00</td>
            <td>162.00</td>
            <td>800.27</td>
        </tr>

    </table>

</body>

</html>
