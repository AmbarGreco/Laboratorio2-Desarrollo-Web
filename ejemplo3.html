<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Configuración de caracteres -->
    <meta charset="UTF-8">

    <!-- Permite adaptar la página a diferentes tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Ejemplo 3</title>

    <!-- Estilos CSS -->
    <style>

        /* Aplica estilos únicamente a los elementos strong
           que se encuentren dentro de un párrafo */
        p strong {

            /* Tipo de letra */
            font-family: "Trebuchet MS", Arial;

            /* Tamaño de la letra */
            font-size: 12px;

            /* Alineación del texto */
            text-align: justify;

            /* Color del texto */
            color: #34484E;

            /* Color de fondo */
            background-color: #ffc;
        }

    </style>

</head>

<body>

    <!-- Inicio del párrafo -->
    <p>

        Jon said,

        <!-- q se utiliza para representar una cita corta -->
        <q>
            That'll be Good when it's <strong>finished</strong>.
        </q>

        <!-- strong resalta una parte importante del texto -->
        If only he <strong>knew</strong>!

    </p>
    <!-- Fin del párrafo -->

</body>

</html>
